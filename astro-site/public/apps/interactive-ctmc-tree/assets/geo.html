<title>World Continents</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0f14;
  --europe: #c8a96e;
  --asia: #d4856a;
  --africa: #a3c47d;
  --n-america: #7ab3c8;
  --s-america: #5a9ab5;
  --oceania: #b07fc4;
  --antarctica: #3a4255;
  --unknown: #2a3348;
  --stroke: #1e2b3e;
  --dim: #4a5575;
}
html, body {
  width:100%; height:100%;
  background:var(--bg);
  overflow:hidden;
}
#wrap {
  position:relative;
  width:100vw; height:100vh;
  display:flex; align-items:center; justify-content:center;
}
svg {
  display:block;
  max-width:100%; max-height:100%;
}
.sphere    { fill:url(#og); }
.graticule { fill:none; stroke:#1a2535; stroke-width:0.5; }
.country   { stroke:var(--stroke); stroke-width:0.45; }
.c-europe      { fill:var(--europe); }
.c-asia        { fill:var(--asia); }
.c-africa      { fill:var(--africa); }
.c-n-america   { fill:var(--n-america); }
.c-s-america   { fill:var(--s-america); }
.c-oceania     { fill:var(--oceania); }
.c-antarctica  { fill:var(--antarctica); }
.c-unknown     { fill:var(--unknown); }
.country:hover { opacity:0.72; }
.sphere-border { fill:none; stroke:#1e2d44; stroke-width:1; }

header {
  position:absolute; top:22px; left:34px;
  font-family: Georgia, 'Times New Roman', serif;
  pointer-events:none;
}
header h1 {
  font-size:0.82rem; font-weight:400;
  letter-spacing:0.38em; text-transform:uppercase;
  color:var(--dim);
}
header p {
  font-size:0.62rem; font-family:monospace;
  color:#2b3650; margin-top:3px; letter-spacing:0.1em;
}
#legend {
  position:absolute; bottom:26px; left:34px;
  display:flex; flex-direction:column; gap:7px;
  font-family:monospace; font-size:0.63rem;
  letter-spacing:0.16em; text-transform:uppercase; color:var(--dim);
  pointer-events:none;
}
.li { display:flex; align-items:center; gap:9px; }
.sw { width:20px; height:3px; border-radius:1px; }
.corner { position:absolute; width:24px; height:24px;
  border-color:#1e2b3e; border-style:solid; opacity:0.7; pointer-events:none; }
.tl{top:12px;left:12px;border-width:1px 0 0 1px}
.tr{top:12px;right:12px;border-width:1px 1px 0 0}
.bl{bottom:12px;left:12px;border-width:0 0 1px 1px}
.br{bottom:12px;right:12px;border-width:0 1px 1px 0}
#tip {
  position:absolute; pointer-events:none;
  background:#0d0f14f0; border:1px solid #2a3348;
  color:#e8dfc8; padding:5px 11px;
  font-size:0.68rem; font-family:monospace; border-radius:2px;
  opacity:0; transition:opacity 0.1s; z-index:20;
}
</style>
</head>

<script>
// hover tooltip only — no projection math needed
const tip = document.getElementById('tip');
document.querySelectorAll('.country').forEach(el => {
  const cls = [...el.classList].find(c => c.startsWith('c-'));
  if (!cls) return;
  const label = cls.replace('c-','').replace('-',' ').replace(/\b\w/g,x=>x.toUpperCase());
  el.addEventListener('mousemove', ev => {
    tip.style.opacity = '1';
    tip.textContent = label;
    tip.style.left = (ev.clientX+14)+'px';
    tip.style.top  = (ev.clientY-30)+'px';
  });
  el.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; });
});
</script>
