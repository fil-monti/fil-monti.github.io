<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Discrete-Time Coalescent (Grid)</title>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 1050px;
    }

    h1 {
      text-align: center;
      font-weight: 800;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 1.05rem;
      margin-bottom: 1.6rem;
    }

    .canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background: #ffffff;
      border: 2px solid #e6e6e6;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      font-family: 'DM Sans', sans-serif;
      background: #2c3e50;
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 2px 10px rgba(44,62,80,0.22);
    }

    button:hover {
      background: #34495e;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(44,62,80,0.25);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(44,62,80,0.22);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #edf0f2;
      border-radius: 12px;
      padding: 10px 12px;
      background: #fbfcfd;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    .pill label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #2c3e50;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill input[type="range"] {
      width: 180px;
    }

    .pill .value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: #2c3e50;
      min-width: 72px;
      text-align: right;
    }

    .info {
      text-align: center;
      margin-top: 10px;
      color: #777;
      font-size: 0.95rem;
    }

    .small-note {
      text-align: center;
      margin-top: 6px;
      color: #999;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Discrete-Time Coalescent on a Grid</h1>
    <p class="subtitle">Lineages start at the present (bottom row) and merge backward in time.</p>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="980" height="640"></canvas>
    </div>

    <div class="controls">
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="stepBtn">⤴ Step</button>
      <button id="resetBtn">↻ Reset</button>

      <div class="pill">
        <label for="speedSlider">Speed</label>
        <input type="range" id="speedSlider" min="0.2" max="3.0" step="0.1" value="1.0" />
        <div class="value" id="speedValue">1.0×</div>
      </div>

      <div class="pill">
        <label for="seedInput">Seed</label>
        <input id="seedInput" type="text" value="42" style="width:90px;padding:8px;border-radius:10px;border:1px solid #e6e6e6;font-family:'JetBrains Mono',monospace;">
        <button id="applySeedBtn" style="padding:10px 14px;">Apply</button>
      </div>
    </div>

    <div class="info">Filled nodes are active ancestral lineages; edges show parent assignment (coalescence allowed).</div>
    <div class="small-note">Tip: “Step” advances one discrete coalescent time step.</div>
  </div>

<script>
  // ---------------------------
  // Canvas + drawing utilities
  // ---------------------------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function clear() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function circle(x, y, r, filled) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#111";
    ctx.stroke();
    if (filled) {
      ctx.fillStyle = "#111";
      ctx.fill();
    }
  }

  function line(x1, y1, x2, y2, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#111";
    ctx.stroke();
    ctx.restore();
  }

  function text(s, x, y, opts = {}) {
    const { font = "600 14px JetBrains Mono", fill = "#2c3e50", align = "left" } = opts;
    ctx.save();
    ctx.font = font;
    ctx.fillStyle = fill;
    ctx.textAlign = align;
    ctx.fillText(s, x, y);
    ctx.restore();
  }

  // ---------------------------
  // Seeded RNG (deterministic)
  // ---------------------------
  // Mulberry32: compact, good enough for visualization.
  function mulberry32(seed) {
    let t = seed >>> 0;
    return function() {
      t += 0x6D2B79F5;
      let x = Math.imul(t ^ (t >>> 15), 1 | t);
      x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function parseSeed(str) {
    // hash string -> 32-bit int
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  let rng = mulberry32(parseSeed("42"));

  // ---------------------------
  // Model: 10×10 grid coalescent
  // ---------------------------
  const GRID = {
    rows: 10,
    cols: 10,
    padX: 70,
    padY: 70,
    radius: 9,
  };

  // Node coordinates: nodes[r][c] = {x,y}
  let nodes = [];
  function buildGrid() {
    nodes = [];
    const w = canvas.width;
    const h = canvas.height;

    const usableW = w - 2 * GRID.padX;
    const usableH = h - 2 * GRID.padY;

    const dx = usableW / (GRID.cols - 1);
    const dy = usableH / (GRID.rows - 1);

    for (let r = 0; r < GRID.rows; r++) {
      const row = [];
      for (let c = 0; c < GRID.cols; c++) {
        row.push({
          x: GRID.padX + c * dx,
          y: GRID.padY + r * dy
        });
      }
      nodes.push(row);
    }
  }

  // State:
  // active[r] is a Set of column indices that are currently "occupied/active" at row r.
  // edges is a list of {child:{r,c}, parent:{r,c}} drawn so far.
  let active = [];
  let edges = [];
  let currentRow = GRID.rows - 1; // start at bottom row (present)

  // Initialize: bottom row all black (observations)
  function resetSimulation() {
    edges = [];
    active = Array.from({length: GRID.rows}, () => new Set());
    currentRow = GRID.rows - 1;

    for (let c = 0; c < GRID.cols; c++) active[currentRow].add(c);

    render();
  }

  // Parent choice rule:
  // For each child in row r, choose a parent column in row r-1.
  // We allow coalescence by letting multiple children pick the same parent.
  //
  // Slightly structured choice:
  // - Mostly pick near the same column (local ancestry), with some randomness.
  function chooseParentCol(childCol) {
    const u = rng();
    if (u < 0.70) return childCol; // stay vertical 70% of time
    if (u < 0.85) return clamp(childCol + (rng() < 0.5 ? -1 : 1), 0, GRID.cols - 1);
    // otherwise jump anywhere
    return Math.floor(rng() * GRID.cols);
  }

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  function stepOnce() {
    if (currentRow === 0) return; // already at top

    const r = currentRow;
    const parentsRow = r - 1;

    const children = Array.from(active[r]).sort((a,b) => a - b);
    if (children.length === 0) return;

    // If we already have only one lineage, you may want to stop early.
    // We'll still let it "climb" to the top (as a single path) for aesthetics.
    const parentSet = new Set();

    for (const childCol of children) {
      const parentCol = chooseParentCol(childCol);
      parentSet.add(parentCol);

      edges.push({
        child: { r, c: childCol },
        parent: { r: parentsRow, c: parentCol }
      });
    }

    // Activate parents row
    active[parentsRow] = parentSet;
    currentRow = parentsRow;

    render();

    // Auto-stop if we reached the top row
    if (currentRow === 0) stop();
  }

  // ---------------------------
  // Rendering
  // ---------------------------
  function render() {
    clear();

    // Background labels (top = past, bottom = present)
    text("Past", 20, GRID.padY - 18, { font: "700 13px JetBrains Mono", fill: "#6b7280" });
    text("Present", 20, canvas.height - GRID.padY + 30, { font: "700 13px JetBrains Mono", fill: "#6b7280" });

    // Draw edges first (behind nodes)
    for (const e of edges) {
      const A = nodes[e.child.r][e.child.c];
      const B = nodes[e.parent.r][e.parent.c];
      // slightly fade older edges for depth
      line(A.x, A.y, B.x, B.y, 0.85);
    }

    // Draw nodes
    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        const isBottom = (r === GRID.rows - 1);
        const isActive = active[r].has(c);

        // bottom row always filled (observations)
        const filled = isBottom || isActive;

        circle(nodes[r][c].x, nodes[r][c].y, GRID.radius, filled);
      }
    }

    // Status
    const activeCount = active[currentRow].size;
    text(`Row: ${currentRow + 1}/${GRID.rows}  |  Active lineages: ${activeCount}`, canvas.width - 20, 28, {
      font: "700 13px JetBrains Mono",
      fill: "#2c3e50",
      align: "right"
    });
  }

  // ---------------------------
  // Animation controls
  // ---------------------------
  let isPlaying = false;
  let timer = null;

  const speedSlider = document.getElementById('speedSlider');
  const speedValue  = document.getElementById('speedValue');

  function getIntervalMs() {
    // speed 0.2× .. 3.0×
    const s = parseFloat(speedSlider.value);
    // base step time ~650ms at 1×, faster at higher speed
    const base = 650;
    return Math.max(60, Math.round(base / s));
  }

  function start() {
    if (isPlaying) return;
    isPlaying = true;

    timer = setInterval(() => {
      stepOnce();
      // stop automatically if top row reached
      if (currentRow === 0) stop();
    }, getIntervalMs());
  }

  function stop() {
    isPlaying = false;
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  function rebuildTimerIfNeeded() {
    if (!isPlaying) return;
    stop();
    start();
  }

  // ---------------------------
  // Wire UI
  // ---------------------------
  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('pauseBtn').addEventListener('click', stop);
  document.getElementById('stepBtn').addEventListener('click', () => { stop(); stepOnce(); });
  document.getElementById('resetBtn').addEventListener('click', () => { stop(); resetSimulation(); });

  speedSlider.addEventListener('input', () => {
    speedValue.textContent = `${parseFloat(speedSlider.value).toFixed(1)}×`;
    rebuildTimerIfNeeded();
  });

  const seedInput = document.getElementById('seedInput');
  document.getElementById('applySeedBtn').addEventListener('click', () => {
    stop();
    rng = mulberry32(parseSeed(seedInput.value.trim() || "0"));
    resetSimulation();
  });

  // ---------------------------
  // Init
  // ---------------------------
  buildGrid();
  resetSimulation();
</script>
</body>
</html>
