
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phylogenetic Tree Evolution</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        #canvas {
            display: block;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        button {
            font-family: 'DM Sans', sans-serif;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.2);
        }

        button:hover {
            background: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .speed-control label {
            color: #333;
            font-weight: 500;
        }

        .speed-control input {
            width: 120px;
        }

        .speed-control input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .info {
            text-align: center;
            margin-top: 1rem;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Sequence Evolution on Phylogenetic Tree</h1>
    <p class="subtitle">Watch how DNA sequences mutate and diverge along evolutionary branches</p>

    <canvas id="canvas" width="1000" height="700"></canvas>

    <div class="controls">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸ Pause</button>
        <button id="resetBtn">↻ Reset</button>
        <div class="speed-control">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="0" max="1" step="0.05" value="0.1">
            <span id="speedValue">0.1x</span>
        </div>
        <div class="speed-control">
            <label for="mutationSlider">Mutation Rate:</label>
            <input type="range" id="mutationSlider" min="0" max="10" step="0.1" value="5">
            <span id="mutationValue">5.00</span>
        </div>
        <div class="speed-control">
            <input type="checkbox" id="highlightCheckbox" checked>
            <label for="highlightCheckbox">Highlight tracked nucleotide</label>
        </div>
        <div class="speed-control">
            <input type="checkbox" id="phylogeographyCheckbox">
            <label for="phylogeographyCheckbox">Phylogeography</label>
        </div>
        <div class="speed-control" id="diffusionRateControl" style="display: none;">
            <label for="diffusionSlider">Diffusion Rate: <span id="diffusionValue">0.50</span></label>
            <input type="range" id="diffusionSlider" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="speed-control">
            <input type="checkbox" id="trackAllBranchesCheckbox">
            <label for="trackAllBranchesCheckbox">Track all branches</label>
        </div>
    </div>

    <p class="info">Sequences split at nodes and evolve independently along each branch</p>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Nucleotide colors
    const colors = {
        'A': '#e74c3c',
        'T': '#3498db',
        'G': '#f39c12',
        'C': '#27ae60'
    };

    const nucleotides = ['A', 'T', 'G', 'C'];

    // Tree structure: Internal node on straight line from Root to Tip 1 (180° angle)
    const tree = {
        x: 500,
        y: 100,
        children: [
            {
                x: 350,
                y: 350,
                children: [
                    { x: 200, y: 600, children: [], label: 'Tip 1' },
                    { x: 500, y: 600, children: [], label: 'Tip 2' }
                ]
            },
            {
                x: 800,
                y: 600,
                children: [],
                label: 'Tip 3'
            }
        ]
    };

    // Animation state
    let sequences = [];
    let animationFrame;
    let isPlaying = false;
    let speed = 0.1;
    let mutationRate = 5; // Probability of mutation per frame

    // CTMC transition tracking
    let ctmcCurrentNucleotide = null;
    let ctmcPreviousNucleotide = null;
    let ctmcTransitionProgress = 1;
    let ctmcTransitionSpeed = 0.1; // Speed of transition animation

    // Highlight tracked nucleotide
    let highlightTrackedNucleotide = true;

    // Phylogeography
    let showPhylogeography = false;
    let trackAllBranches = false;
    let diffusionRate = 0.5; // Controls CTMC rate

    // World map GeoJSON data
    let worldLandGeoJSON = null;

    // -----------------------------
    // SIMPLE CONTINENT CTMC + COMET TRAIL (efficient)
    // -----------------------------

    // Continent anchor points (imaginary but fixed)
    const geoStates = [
        { name: "North America", lon: -100, lat: 40 },
        { name: "South America", lon:  -60, lat: -15 },
        { name: "Europe",        lon:   10, lat:  50 },
        { name: "Africa",        lon:   20, lat:   5 },
        { name: "Middle East",   lon:   50, lat:  25 },
        { name: "East Asia",     lon:  110, lat:  35 },
        { name: "Australia",     lon:  135, lat: -25 },
    ];

    // Row-stochastic transition matrix for jumps (discrete-time jump kernel)
    const P = [
        //   NA    SA    EU    AF    ME    EA    AU
        [ 0.10, 0.45, 0.20, 0.10, 0.10, 0.05, 0.00 ], // NA
        [ 0.45, 0.10, 0.10, 0.25, 0.10, 0.00, 0.00 ], // SA
        [ 0.20, 0.05, 0.10, 0.25, 0.25, 0.15, 0.00 ], // EU
        [ 0.10, 0.20, 0.25, 0.10, 0.20, 0.10, 0.05 ], // AF
        [ 0.10, 0.05, 0.25, 0.20, 0.10, 0.25, 0.05 ], // ME
        [ 0.05, 0.00, 0.15, 0.10, 0.25, 0.10, 0.35 ], // EA
        [ 0.00, 0.00, 0.00, 0.10, 0.15, 0.55, 0.20 ], // AU
    ];

    function sampleCategorical(probs) {
        let r = Math.random();
        for (let i = 0; i < probs.length; i++) {
            r -= probs[i];
            if (r <= 0) return i;
        }
        return probs.length - 1;
    }

    function sampleExp(rate) {
        // rate > 0, return waiting time in seconds
        return -Math.log(1 - Math.random()) / rate;
    }

    // One moving dot with a comet trail
    // Uses a CTMC: hold in a state for Exp(lambda) seconds, then jump to next state by P
    class GeoCTMCStar {
        constructor(initialStateIndex = 0) {
            this.i = initialStateIndex;        // current state
            this.j = initialStateIndex;        // next state
            this.t = 1;                        // interpolation progress [0,1]
            this.holding = true;               // true while waiting in a state

            this.lambda = 0.8;                 // jumps per second (overall rate)
            this.travelTime = 0.6;             // seconds to visually "fly" between states

            this.holdRemaining = sampleExp(this.lambda);

            // comet trail: list of {x,y,age} where age in seconds
            this.trail = [];
            this.trailMaxAge = 1.0;            // seconds of visible tail
            this.trailSampleHz = 60;           // points per second
            this._trailAcc = 0;
        }

        setRate(rate01) {
            // map slider [0,1] -> reasonable CTMC rate (avoid 0)
            this.lambda = 0.15 + 2.5 * rate01;
        }

        // returns current lon/lat by interpolating between i and j (or i if holding)
        currentLonLat() {
            const a = geoStates[this.i];
            if (this.holding) return { lon: a.lon, lat: a.lat };

            const b = geoStates[this.j];
            const u = this.t;

            // simple linear interpolation
            return { lon: a.lon + (b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u };
        }

        update(dt) {
            if (this.holding) {
                this.holdRemaining -= dt;
                if (this.holdRemaining <= 0) {
                    // jump decision
                    this.j = sampleCategorical(P[this.i]);
                    if (this.j === this.i) {
                        // re-hold
                        this.holdRemaining = sampleExp(this.lambda);
                    } else {
                        this.holding = false;
                        this.t = 0;
                    }
                }
            } else {
                this.t += dt / this.travelTime;
                if (this.t >= 1) {
                    this.t = 1;
                    this.i = this.j;
                    this.holding = true;
                    this.holdRemaining = sampleExp(this.lambda);
                }
            }
        }

        // maintain sticky comet trail in pixel space
        updateTrail(dt, x, y) {
            // age existing points
            for (const p of this.trail) p.age += dt;
            // drop old
            while (this.trail.length && this.trail[0].age > this.trailMaxAge) {
                this.trail.shift();
            }

            // add new samples at fixed rate
            this._trailAcc += dt;
            const step = 1 / this.trailSampleHz;
            while (this._trailAcc >= step) {
                this._trailAcc -= step;
                this.trail.push({ x, y, age: 0 });
            }
        }

        draw(ctx) {
            // Draw comet trail: older points are fainter and thinner
            if (this.trail.length > 1) {
                for (let k = 1; k < this.trail.length; k++) {
                    const p0 = this.trail[k - 1];
                    const p1 = this.trail[k];
                    const a = 1 - (p1.age / this.trailMaxAge); // 1 -> 0
                    const alpha = Math.max(0, Math.min(1, a));

                    ctx.strokeStyle = `rgba(0,0,0,${0.55 * alpha})`;
                    ctx.lineWidth = 1 + 2 * alpha;

                    ctx.beginPath();
                    ctx.moveTo(p0.x, p0.y);
                    ctx.lineTo(p1.x, p1.y);
                    ctx.stroke();
                }
            }

            // Head (dot)
            const head = this.trail.length ? this.trail[this.trail.length - 1] : null;
            if (head) {
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(head.x, head.y, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "#333";
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
        }

        currentStateName() {
            return geoStates[this.i].name;
        }
    }

    // We'll run ONE star for the "tracked" lineage
    let geoStar = null;
    let lastTimeSec = null;

    // Great circle interpolation (spherical linear interpolation)
    function greatCircleInterpolate(lon1, lat1, lon2, lat2, t) {
        // Convert to radians
        const toRad = Math.PI / 180;
        const toDeg = 180 / Math.PI;

        const φ1 = lat1 * toRad;
        const φ2 = lat2 * toRad;
        const λ1 = lon1 * toRad;
        const λ2 = lon2 * toRad;

        // Calculate angular distance
        const Δφ = φ2 - φ1;
        const Δλ = λ2 - λ1;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const δ = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        if (δ < 0.001) {
            // Points are very close, use simple linear interpolation
            return {
                lon: lon1 + (lon2 - lon1) * t,
                lat: lat1 + (lat2 - lat1) * t
            };
        }

        // Spherical linear interpolation
        const A = Math.sin((1-t)*δ) / Math.sin(δ);
        const B = Math.sin(t*δ) / Math.sin(δ);

        const x = A * Math.cos(φ1) * Math.cos(λ1) + B * Math.cos(φ2) * Math.cos(λ2);
        const y = A * Math.cos(φ1) * Math.sin(λ1) + B * Math.cos(φ2) * Math.sin(λ2);
        const z = A * Math.sin(φ1) + B * Math.sin(φ2);

        const φ = Math.atan2(z, Math.sqrt(x*x + y*y));
        const λ = Math.atan2(y, x);

        return {
            lon: λ * toDeg,
            lat: φ * toDeg
        };
    }

    // Initial sequence
    const initialSequence = ['A', 'T', 'G', 'C', 'A'];

    function drawTree() {
        ctx.strokeStyle = '#34495e';
        ctx.lineWidth = 3;

        function drawNode(node) {
            if (node.children.length > 0) {
                node.children.forEach(child => {
                    ctx.beginPath();
                    ctx.moveTo(node.x, node.y);
                    ctx.lineTo(child.x, child.y);
                    ctx.stroke();
                    drawNode(child);
                });
            }

            // Draw node circles
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.children.length > 0 ? 8 : 10, 0, Math.PI * 2);
            ctx.fill();

            // Draw labels for tips
            if (node.label) {
                ctx.fillStyle = '#555';
                ctx.font = '14px "DM Sans"';
                ctx.textAlign = 'center';
                ctx.fillText(node.label, node.x, node.y + 40);
            }
        }

        // Draw root label
        ctx.fillStyle = '#555';
        ctx.font = '14px "DM Sans"';
        ctx.textAlign = 'center';
        ctx.fillText('Root', tree.x, tree.y - 20);

        drawNode(tree);
    }

    // Load world land GeoJSON data
    async function loadWorldLand() {
        if (worldLandGeoJSON) return;
        try {
            // Using Natural Earth 110m resolution land data from CDN
            const resp = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json");
            const topology = await resp.json();
            // Convert TopoJSON to GeoJSON
            worldLandGeoJSON = topojson.feature(topology, topology.objects.land);
        } catch (error) {
            console.error("Failed to load world map data:", error);
        }
    }

    // Project lon/lat to canvas x/y (simple equirectangular projection)
    function projectEquirect(lon, lat, offsetX, offsetY, w, h) {
        // lon in [-180, 180], lat in [-90, 90]
        const x = offsetX + ((lon + 180) / 360) * w;
        const y = offsetY + ((90 - lat) / 180) * h;
        return [x, y];
    }

    // Draw GeoJSON land data on canvas
    function drawGeoJSONLand(ctx, geojson, offsetX, offsetY, w, h) {
        const drawRing = (ring) => {
            ring.forEach((pt, i) => {
                const [lon, lat] = pt;
                const [x, y] = projectEquirect(lon, lat, offsetX, offsetY, w, h);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
        };

        for (const feat of geojson.features) {
            const g = feat.geometry;
            if (!g) continue;

            ctx.beginPath();
            if (g.type === "Polygon") {
                g.coordinates.forEach(drawRing);
            } else if (g.type === "MultiPolygon") {
                g.coordinates.forEach(poly => poly.forEach(drawRing));
            }
            ctx.fill();
            ctx.stroke();
        }
    }

    function drawPhylogeography() {
        // Draw proper world map in top right corner (moved right, 5% smaller)
        const offsetX = canvas.width - 360;
        const offsetY = 50;
        const mapWidth = 342;
        const mapHeight = 200;

        // Draw ocean background
        ctx.fillStyle = '#e3f2fd';
        ctx.fillRect(offsetX, offsetY, mapWidth, mapHeight);
        ctx.strokeStyle = '#90a4ae';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(offsetX, offsetY, mapWidth, mapHeight);

        // Draw land masses from GeoJSON
        if (worldLandGeoJSON) {
            ctx.fillStyle = '#a5d6a7';
            ctx.strokeStyle = '#66bb6a';
            ctx.lineWidth = 0.5;
            drawGeoJSONLand(ctx, worldLandGeoJSON, offsetX, offsetY, mapWidth, mapHeight);
        } else {
            // Fallback: show loading text
            ctx.fillStyle = '#666';
            ctx.font = '12px "DM Sans"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Loading map...', offsetX + mapWidth/2, offsetY + mapHeight/2);
        }

        // Clip to map bounds
        ctx.save();
        ctx.beginPath();
        ctx.rect(offsetX, offsetY, mapWidth, mapHeight);
        ctx.clip();

        // Draw the star (trail + dot)
        if (geoStar) geoStar.draw(ctx);

        ctx.restore();

        // Add title
        ctx.fillStyle = '#555';
        ctx.font = '14px "DM Sans"';
        ctx.textAlign = 'center';
        ctx.fillText('Geographic Distribution', offsetX + mapWidth/2, offsetY - 12);

        // Show current continent name
        if (geoStar) {
            ctx.fillStyle = '#555';
            ctx.font = '12px "DM Sans"';
            ctx.textAlign = 'right';
            ctx.fillText(geoStar.currentStateName(), canvas.width - 25, offsetY + mapHeight + 25);
        }
    }

    function drawCTMC(currentNucleotide = null, previousNucleotide = null, transitionProgress = 1) {
        // Draw CTMC (Continuous Time Markov Chain) in top left corner
        const offsetX = 80;
        const offsetY = 80;
        const size = 120;  // Doubled from 60

        // Define square vertices with nucleotides
        const vertices = [
            { x: offsetX, y: offsetY, nucleotide: 'A' },           // top-left
            { x: offsetX + size, y: offsetY, nucleotide: 'T' },    // top-right
            { x: offsetX + size, y: offsetY + size, nucleotide: 'G' }, // bottom-right
            { x: offsetX, y: offsetY + size, nucleotide: 'C' }     // bottom-left
        ];

        // Draw edges between all vertices (showing all possible transitions)
        ctx.strokeStyle = '#bdc3c7';
        ctx.lineWidth = 2;

        // Function to draw arrow head
        function drawArrowHead(fromX, fromY, toX, toY, color = '#bdc3c7') {
            const headLength = 8;
            const angle = Math.atan2(toY - fromY, toX - fromX);

            // Shorten the line to stop at vertex edge (radius 16)
            const shortenDistance = 16;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const length = Math.sqrt(dx * dx + dy * dy);
            const ratio = (length - shortenDistance) / length;
            const endX = fromX + dx * ratio;
            const endY = fromY + dy * ratio;

            ctx.strokeStyle = color;
            ctx.fillStyle = color;

            // Draw arrow head
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(
                endX - headLength * Math.cos(angle - Math.PI / 6),
                endY - headLength * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                endX - headLength * Math.cos(angle + Math.PI / 6),
                endY - headLength * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fill();
        }

        // Draw all edges with bidirectional arrows
        // Horizontal and vertical edges
        for (let i = 0; i < vertices.length; i++) {
            const next = (i + 1) % vertices.length;
            const from = vertices[i];
            const to = vertices[next];

            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();

            // Draw arrow heads in both directions
            drawArrowHead(from.x, from.y, to.x, to.y);
            drawArrowHead(to.x, to.y, from.x, from.y);
        }

        // Diagonal edges
        // Diagonal 1: top-left to bottom-right
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        ctx.lineTo(vertices[2].x, vertices[2].y);
        ctx.stroke();
        drawArrowHead(vertices[0].x, vertices[0].y, vertices[2].x, vertices[2].y);
        drawArrowHead(vertices[2].x, vertices[2].y, vertices[0].x, vertices[0].y);

        // Diagonal 2: top-right to bottom-left
        ctx.beginPath();
        ctx.moveTo(vertices[1].x, vertices[1].y);
        ctx.lineTo(vertices[3].x, vertices[3].y);
        ctx.stroke();
        drawArrowHead(vertices[1].x, vertices[1].y, vertices[3].x, vertices[3].y);
        drawArrowHead(vertices[3].x, vertices[3].y, vertices[1].x, vertices[1].y);

        // Draw vertices (nucleotide circles)
        vertices.forEach(v => {
            ctx.fillStyle = colors[v.nucleotide];
            ctx.beginPath();
            ctx.arc(v.x, v.y, 16, 0, Math.PI * 2);
            ctx.fill();

            // Draw nucleotide letter
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px "JetBrains Mono"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(v.nucleotide, v.x, v.y);
        });

        // Draw tracking point with transition animation
        if (currentNucleotide) {
            const currentVertex = vertices.find(v => v.nucleotide === currentNucleotide);

            if (previousNucleotide && transitionProgress < 1) {
                // Animating transition
                const previousVertex = vertices.find(v => v.nucleotide === previousNucleotide);
                if (previousVertex && currentVertex) {
                    // Interpolate position along the edge/diagonal
                    const x = previousVertex.x + (currentVertex.x - previousVertex.x) * transitionProgress;
                    const y = previousVertex.y + (currentVertex.y - previousVertex.y) * transitionProgress;

                    // Draw trail
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(previousVertex.x, previousVertex.y);
                    ctx.lineTo(x, y);
                    ctx.stroke();

                    // Draw arrow head on trail
                    const headLength = 8;
                    const angle = Math.atan2(y - previousVertex.y, x - previousVertex.x);
                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(
                        x - headLength * Math.cos(angle - Math.PI / 6),
                        y - headLength * Math.sin(angle - Math.PI / 6)
                    );
                    ctx.lineTo(
                        x - headLength * Math.cos(angle + Math.PI / 6),
                        y - headLength * Math.sin(angle + Math.PI / 6)
                    );
                    ctx.closePath();
                    ctx.fill();

                    // Draw moving dot
                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (currentVertex) {
                // Stationary at current vertex
                // Draw outer ring
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(currentVertex.x, currentVertex.y, 24, 0, Math.PI * 2);
                ctx.stroke();

                // Draw center dot
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(currentVertex.x, currentVertex.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Add label
        ctx.fillStyle = '#555';
        ctx.font = '14px "DM Sans"';
        ctx.textAlign = 'center';
        ctx.fillText('CTMC', offsetX + size/2, offsetY - 20);

        // Add tracking info
        ctx.fillStyle = '#888';
        ctx.font = '11px "DM Sans"';
        ctx.fillText('Tracking: 1st nucleotide (Root → Tip 1)', offsetX + size/2, offsetY + size + 30);
    }

    function drawCTMCLegend() {
        // Draw legend below CTMC in two rows mirroring the square layout
        const offsetX = 80;
        const offsetY = 260; // Below CTMC and tracking label
        const boxSize = 18;
        const horizontalSpacing = 85;
        const verticalSpacing = 24;

        // Row 1: A and T (top row of CTMC)
        // A (Adenine)
        ctx.fillStyle = colors['A'];
        ctx.fillRect(offsetX, offsetY, boxSize, boxSize);

        // Draw white letter inside box
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', offsetX + boxSize/2, offsetY + boxSize/2);

        // Draw label
        ctx.fillStyle = '#555';
        ctx.font = '11px "DM Sans"';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Adenine', offsetX + boxSize + 6, offsetY + boxSize/2);

        // T (Thymine)
        ctx.fillStyle = colors['T'];
        ctx.fillRect(offsetX + horizontalSpacing, offsetY, boxSize, boxSize);

        // Draw white letter inside box
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('T', offsetX + horizontalSpacing + boxSize/2, offsetY + boxSize/2);

        // Draw label
        ctx.fillStyle = '#555';
        ctx.font = '11px "DM Sans"';
        ctx.textAlign = 'left';
        ctx.fillText('Thymine', offsetX + horizontalSpacing + boxSize + 6, offsetY + boxSize/2);

        // Row 2: C and G (bottom row of CTMC)
        const row2Y = offsetY + verticalSpacing;

        // C (Cytosine)
        ctx.fillStyle = colors['C'];
        ctx.fillRect(offsetX, row2Y, boxSize, boxSize);

        // Draw white letter inside box
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('C', offsetX + boxSize/2, row2Y + boxSize/2);

        // Draw label
        ctx.fillStyle = '#555';
        ctx.font = '11px "DM Sans"';
        ctx.textAlign = 'left';
        ctx.fillText('Cytosine', offsetX + boxSize + 6, row2Y + boxSize/2);

        // G (Guanine)
        ctx.fillStyle = colors['G'];
        ctx.fillRect(offsetX + horizontalSpacing, row2Y, boxSize, boxSize);

        // Draw white letter inside box
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('G', offsetX + horizontalSpacing + boxSize/2, row2Y + boxSize/2);

        // Draw label
        ctx.fillStyle = '#555';
        ctx.font = '11px "DM Sans"';
        ctx.textAlign = 'left';
        ctx.fillText('Guanine', offsetX + horizontalSpacing + boxSize + 6, row2Y + boxSize/2);
    }

    function drawSequence(seq, showHighlight = false) {
        const boxSize = 15;
        const spacing = 2;
        const totalWidth = (boxSize + spacing) * seq.sequence.length - spacing;
        const startX = seq.x - totalWidth / 2;

        seq.sequence.forEach((nucleotide, i) => {
            const x = startX + i * (boxSize + spacing);
            const y = seq.y - 5;  // Lower position to avoid hiding labels

            // Draw box with slight shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;

            ctx.fillStyle = colors[nucleotide];
            ctx.fillRect(x, y, boxSize, boxSize);

            ctx.shadowColor = 'transparent';

            // Draw nucleotide letter
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px "JetBrains Mono"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(nucleotide, x + boxSize / 2, y + boxSize / 2);

            // Highlight if recently mutated
            if (seq.mutatedIndices && seq.mutatedIndices.includes(i)) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.strokeRect(x - 2, y - 2, boxSize + 4, boxSize + 4);
            }

            // Draw tracking square around first nucleotide if this sequence is tracked
            if (showHighlight && i === 0) {
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 3, y - 3, boxSize + 6, boxSize + 6);
            }
        });
    }

    function mutateSequence(sequence) {
        const newSequence = [...sequence];
        const mutatedIndices = [];

        newSequence.forEach((nucleotide, i) => {
            if (Math.random() < mutationRate * speed / 60) {
                const otherNucleotides = nucleotides.filter(n => n !== nucleotide);
                newSequence[i] = otherNucleotides[Math.floor(Math.random() * otherNucleotides.length)];
                mutatedIndices.push(i);
            }
        });

        return { sequence: newSequence, mutatedIndices };
    }

    function createSequence(x, y, targetX, targetY, sequence, parent = null, started = false, tracked = false) {
        // Calculate distance for speed normalization
        const startX = parent ? parent.x : x;
        const startY = parent ? parent.y : y;
        const distance = Math.sqrt(Math.pow(targetX - startX, 2) + Math.pow(targetY - startY, 2));

        return {
            x, y,
            targetX, targetY,
            sequence: [...sequence],
            progress: 0,
            parent: parent,
            mutatedIndices: [],
            started: started,
            tracked: tracked,
            distance: distance
        };
    }

    function initAnimation() {
        sequences = [];
        // Create two identical copies at the root, but don't start them moving yet
        // Mark the first one (going to left branch) as tracked for CTMC
        tree.children.forEach((child, index) => {
            const seq = createSequence(tree.x, tree.y, child.x, child.y, initialSequence, null, false, index === 0);
            // Mark which branch this is for dynamic tracking decision
            seq.branchIndex = index; // 0 = left (to internal node/tip 1), 1 = right (to tip 3)
            seq.trackedGeo = true; // Both are potentially trackable, will filter dynamically
            sequences.push(seq);
        });

        // Initialize CTMC state
        ctmcCurrentNucleotide = initialSequence[0];
        ctmcPreviousNucleotide = null;
        ctmcTransitionProgress = 1;

        // Initialize geographic star
        geoStar = new GeoCTMCStar(0); // start in North America
        lastTimeSec = null;

        // Draw the initial state
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTree();
        // Show initial first nucleotide in CTMC
        drawCTMC(ctmcCurrentNucleotide, ctmcPreviousNucleotide, ctmcTransitionProgress);
        drawCTMCLegend();

        // Draw phylogeography map if enabled
        if (showPhylogeography) {
            drawPhylogeography();
        }

        sequences.forEach(seq => {
            const showHighlight = highlightTrackedNucleotide && seq.tracked;
            drawSequence(seq, showHighlight);
        });
    }

    function animate() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTree();

        // Find the tracked sequence and get its first nucleotide
        let trackedNucleotide = null;
        const trackedSequence = sequences.find(seq => seq.tracked);
        if (trackedSequence) {
            trackedNucleotide = trackedSequence.sequence[0];
        }

        // --- Time step for continuous simulation ---
        const now = performance.now() / 1000;
        if (lastTimeSec === null) lastTimeSec = now;
        const dt = Math.min(0.05, now - lastTimeSec); // cap dt for stability
        lastTimeSec = now;

        // --- Update geo star (only if phylogeography on) ---
        if (showPhylogeography && geoStar) {
            geoStar.setRate(diffusionRate); // reuse diffusion rate slider as CTMC rate control

            geoStar.update(dt);

            // Convert current lon/lat to map pixel, then update trail with pixel coords
            // Use same map rect as drawPhylogeography
            const offsetX = canvas.width - 360;
            const offsetY = 50;
            const mapWidth = 342;
            const mapHeight = 200;

            const ll = geoStar.currentLonLat();
            const [x, y] = projectEquirect(ll.lon, ll.lat, offsetX, offsetY, mapWidth, mapHeight);
            geoStar.updateTrail(dt, x, y);
        }

        // Detect nucleotide change and start transition
        if (trackedNucleotide && trackedNucleotide !== ctmcCurrentNucleotide) {
            if (ctmcCurrentNucleotide !== null) {
                // Start transition
                ctmcPreviousNucleotide = ctmcCurrentNucleotide;
                ctmcTransitionProgress = 0;
            }
            ctmcCurrentNucleotide = trackedNucleotide;
        }

        // Update transition progress
        if (ctmcTransitionProgress < 1) {
            ctmcTransitionProgress += ctmcTransitionSpeed;
            if (ctmcTransitionProgress >= 1) {
                ctmcTransitionProgress = 1;
                ctmcPreviousNucleotide = null;
            }
        }

        drawCTMC(ctmcCurrentNucleotide, ctmcPreviousNucleotide, ctmcTransitionProgress);
        drawCTMCLegend();

        // Draw phylogeography map if enabled
        if (showPhylogeography) {
            drawPhylogeography();
        }

        const newSequences = [];

        sequences.forEach(seq => {
            // If sequence is fixated at a tip, just keep it there without mutating
            if (seq.fixated) {
                seq.mutatedIndices = []; // Clear any mutation highlights
                newSequences.push(seq);
                return;
            }

            // Only progress if the sequence has started
            if (seq.started) {
                // Use constant pixel speed (5 pixels per frame as base)
                const basePixelSpeed = 5;
                const progressIncrement = (basePixelSpeed * speed) / seq.distance;
                seq.progress += progressIncrement;
            }

            if (seq.progress <= 1) {
                // Interpolate position
                seq.x = seq.parent ? seq.parent.x : tree.x;
                seq.y = seq.parent ? seq.parent.y : tree.y;

                seq.x += (seq.targetX - seq.x) * seq.progress;
                seq.y += (seq.targetY - seq.y) * seq.progress;

                // Only mutate if the sequence is actually moving
                if (seq.started && seq.progress > 0) {
                    const mutated = mutateSequence(seq.sequence);
                    seq.sequence = mutated.sequence;
                    seq.mutatedIndices = mutated.mutatedIndices;
                }

                newSequences.push(seq);
            } else {
                // Reached target - check if it's a node with children
                let foundNode = null;

                function findNode(node) {
                    if (Math.abs(node.x - seq.targetX) < 1 && Math.abs(node.y - seq.targetY) < 1) {
                        return node;
                    }
                    for (let child of node.children) {
                        const found = findNode(child);
                        if (found) return found;
                    }
                    return null;
                }

                foundNode = findNode(tree);

                if (foundNode && foundNode.children.length > 0) {
                    // Split sequence at internal node
                    foundNode.children.forEach((child, childIndex) => {
                        // For CTMC tracking: only first child (to Tip 1) is tracked
                        const isTrackedForCTMC = seq.tracked && (child.x === 200 && child.y === 600);

                        // For phylogeography: always only track the branch going to Tip 1
                        const isTrackedForGeo = seq.trackedGeo && (child.x === 200 && child.y === 600);

                        const newSeq = createSequence(
                            foundNode.x,
                            foundNode.y,
                            child.x,
                            child.y,
                            seq.sequence,
                            foundNode,
                            true,  // New sequences from splits should start moving
                            isTrackedForCTMC
                        );
                        // Propagate branch index and geo tracking flag
                        newSeq.branchIndex = seq.branchIndex;
                        newSeq.trackedGeo = isTrackedForGeo;
                        newSequences.push(newSeq);
                    });
                } else if (foundNode && foundNode.children.length === 0) {
                    // Reached a tip - fixate the sequence here
                    seq.fixated = true;
                    seq.x = foundNode.x;
                    seq.y = foundNode.y;
                    newSequences.push(seq);
                }
            }
        });

        sequences = newSequences;

        // Draw all sequences
        sequences.forEach(seq => {
            const showHighlight = highlightTrackedNucleotide && seq.tracked;
            drawSequence(seq, showHighlight);
        });

        // Continue animation if playing
        if (sequences.length > 0) {
            animationFrame = requestAnimationFrame(animate);
        }
    }

    // Controls
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const mutationSlider = document.getElementById('mutationSlider');
    const mutationValue = document.getElementById('mutationValue');
    const highlightCheckbox = document.getElementById('highlightCheckbox');
    const phylogeographyCheckbox = document.getElementById('phylogeographyCheckbox');
    const diffusionRateControl = document.getElementById('diffusionRateControl');
    const diffusionSlider = document.getElementById('diffusionSlider');
    const diffusionValue = document.getElementById('diffusionValue');
    const trackAllBranchesCheckbox = document.getElementById('trackAllBranchesCheckbox');

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (sequences.length === 0) {
                initAnimation();
            }
            // Initialize geoStar if phylogeography is enabled and star doesn't exist
            if (showPhylogeography && !geoStar) {
                geoStar = new GeoCTMCStar(0);
                lastTimeSec = null;
            }
            // Start all sequences moving
            sequences.forEach(seq => {
                seq.started = true;
            });
            isPlaying = true;
            playBtn.textContent = '▶ Playing...';
            animate();
        }
    });

    pauseBtn.addEventListener('click', () => {
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
        }
    });

    resetBtn.addEventListener('click', () => {
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
        }
        initAnimation();
    });

    speedSlider.addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        speedValue.textContent = speed + 'x';
    });

    mutationSlider.addEventListener('input', (e) => {
        mutationRate = parseFloat(e.target.value);
        mutationValue.textContent = mutationRate.toFixed(2);
    });

    highlightCheckbox.addEventListener('change', (e) => {
        highlightTrackedNucleotide = e.target.checked;
    });

    phylogeographyCheckbox.addEventListener('change', (e) => {
        showPhylogeography = e.target.checked;

        // Show/hide diffusion rate control
        diffusionRateControl.style.display = showPhylogeography ? 'flex' : 'none';

        // Initialize geoStar when phylogeography is enabled
        if (showPhylogeography && !geoStar) {
            geoStar = new GeoCTMCStar(0);
            lastTimeSec = null;
        }

        // Redraw to show/hide map immediately
        if (!isPlaying) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTree();
            drawCTMC(ctmcCurrentNucleotide, ctmcPreviousNucleotide, ctmcTransitionProgress);
            drawCTMCLegend();
            if (showPhylogeography) {
                drawPhylogeography();
            }
            sequences.forEach(seq => {
                const showHighlight = highlightTrackedNucleotide && seq.tracked;
                drawSequence(seq, showHighlight);
            });
        }
    });

    diffusionSlider.addEventListener('input', (e) => {
        diffusionRate = parseFloat(e.target.value);
        diffusionValue.textContent = diffusionRate.toFixed(2);
    });

    trackAllBranchesCheckbox.addEventListener('change', (e) => {
        trackAllBranches = e.target.checked;
        // Note: trackAllBranches is currently not used with the single GeoCTMCStar approach
    });

    // Initial draw with async loading
    (async function boot() {
        await loadWorldLand();
        drawTree();
        initAnimation();
    })();
</script>
</body>
</html>
